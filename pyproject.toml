[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "veil"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["veil*", "simulator*", "dashboard*"]
